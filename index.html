<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Citizenship Document Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #222222;
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      background-color: #f4f6f8;
    }
    .form-card {
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .btn-primary {
      background-color: #d92525;
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-primary:hover {
      background-color: #b01c1c;
    }
    .btn-copy {
      background-color: #0056b3;
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-copy:hover {
      background-color: #003d80;
    }
    .email-container {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 30px;
      font-family: Arial, sans-serif;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .email-header {
      background: #eef2f5;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
      border: 1px solid #d0d7de;
    }
  </style>
</head>
<body>

  <h2>🇨🇦 Canadian Citizenship Client Email Generator</h2>
  <p>Fill in the client's information to generate a structured email with forms, official link URLs, and exact document sources.</p>

  <div class="form-card">
    <div class="form-group">
      <label for="clientName">Client's Full Name:</label>
      <input type="text" id="clientName" placeholder="e.g., John Smith">
    </div>

    <div class="form-group">
      <label for="generations">How many generations back is the Canadian ancestor?</label>
      <select id="generations">
        <option value="1">Parent (1st Generation)</option>
        <option value="2">Grandparent (2nd Generation)</option>
        <option value="3">Great-Grandparent (3rd Generation)</option>
      </select>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" id="nameChange"> Client or ancestor had a legal name change (e.g., marriage)
      </label>
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="generateEmail()">Generate Client Email</button>
      <button class="btn-copy" id="copyBtn" onclick="copyEmailToClipboard()">📋 Copy Email Text</button>
    </div>
  </div>

  <div id="resultsArea" style="display:none;">
    <h3>Generated Email Output:</h3>
    <div class="email-container" id="emailBody"></div>
  </div>

  <script>
    let rawTextContent = "";

    function generateEmail() {
      const name = document.getElementById('clientName').value.trim() || 'Client';
      const gens = parseInt(document.getElementById('generations').value);
      const nameChange = document.getElementById('nameChange').checked;

      // HTML view header
      let htmlHeader = `<div class="email-header"><strong>Subject:</strong> Action Required: Checklist & Forms for Your Canadian Citizenship Application</div>`;
      
      // Plain text for clipboard
      rawTextContent = `Subject: Action Required: Checklist & Forms for Your Canadian Citizenship Application\n\n`;
      
      let bodyText = `Dear ${name},\n\n`;
      bodyText += `Thank you for reaching out regarding your application for a Canadian Citizenship Certificate (Proof of Citizenship).\n\n`;
      bodyText += `Based on your lineage (${gens} generation(s) back to your Canadian ancestor), below is the complete breakdown of the official IRCC forms to submit and the exact documents you need to obtain along with where to get them.\n\n`;

      bodyText += `--------------------------------------------------\n`;
      bodyText += `1. OFFICIAL IRCC APPLICATION FORMS & PAYMENT PORTAL\n`;
      bodyText += `--------------------------------------------------\n\n`;
      
      bodyText += `• Main Application Form:\n`;
      bodyText += `  Form CIT 0001 (Application for a Citizenship Certificate)\n`;
      bodyText += `  Download URL: https://www.canada.ca/en/immigration-refugees-citizenship/services/application/application-forms-guides/cit0001.html\n\n`;

      bodyText += `• IRCC Official Fee Payment Portal:\n`;
      bodyText += `  Payment URL: https://www.cic.gc.ca/english/information/fees/index.asp\n\n`;

      bodyText += `--------------------------------------------------\n`;
      bodyText += `2. REQUIRED SUPPORTING DOCUMENTS TO OBTAIN\n`;
      bodyText += `--------------------------------------------------\n\n`;

      // Applicant Docs
      bodyText += `• APPLICANT IDENTIFICATION:\n`;
      bodyText += `  - Document: Long-Form US Birth Certificate (Must list parents' names)\n`;
      bodyText += `    Where to Get: State Department of Vital Statistics or online via VitalChek\n`;
      bodyText += `    URL: https://www.vitalchek.com\n\n`;

      bodyText += `  - Document: Two (2) Primary Photo IDs (e.g., Unexpired US Passport & Driver's License)\n`;
      bodyText += `    Where to Get: US Department of State / Local State DMV\n`;
      bodyText += `    URL: https://travel.state.gov\n\n`;

      bodyText += `  - Document: Two (2) Official Canadian Citizenship Photos\n`;
      bodyText += `    Where to Get: Professional Photo Studio (Must strictly meet 50 mm x 70 mm IRCC specs)\n`;
      bodyText += `    URL: https://www.canada.ca/en/immigration-refugees-citizenship/services/canadian-citizenship/proof-citizenship/preparation/take-photos.html\n\n`;

      if (nameChange) {
        bodyText += `• PROOF OF LEGAL NAME CHANGE:\n`;
        bodyText += `  - Document: Official Marriage Certificate or Court Order\n`;
        bodyText += `    Where to Get: County Clerk / State Vital Statistics Office\n`;
        bodyText += `    URL: https://www.vitalchek.com\n\n`;
      }

      // Ancestor Docs
      for (let i = 1; i <= gens; i++) {
        if (i === gens) {
          bodyText += `• CANADIAN ANCESTOR (Generation ${i}):\n`;
          bodyText += `  - Document: Official Provincial/Territorial Birth Certificate or Canadian Citizenship/Naturalization Certificate\n`;
          bodyText += `    Where to Get: Vital Statistics Division of the Canadian Province of birth (or IRCC record search)\n`;
          bodyText += `    URL: https://www.canada.ca/en/immigration-refugees-citizenship/services/canadian-citizenship/proof-citizenship/documents.html\n\n`;
        } else {
          bodyText += `• INTERMEDIATE RELATIVE (Generation ${i}):\n`;
          bodyText += `  - Document: Certified Long-Form US Birth Certificate (proving legal line of parentage)\n`;
          bodyText += `    Where to Get: State Vital Statistics Department or VitalChek\n`;
          bodyText += `    URL: https://www.vitalchek.com\n\n`;
        }
      }

      bodyText += `--------------------------------------------------\n`;
      bodyText += `NEXT STEPS\n`;
      bodyText += `--------------------------------------------------\n`;
      bodyText += `Please start gathering the state and provincial records listed above. Once gathered, reply to this email so we can review the package before submission.\n\n`;
      bodyText += `Best regards,\n`;
      bodyText += `Citizenship Advisory Team`;

      rawTextContent += bodyText;

      document.getElementById('emailBody').innerHTML = htmlHeader + bodyText;
      document.getElementById('resultsArea').style.display = 'block';

      // Reset copy button styling
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "📋 Copy Email Text";
      copyBtn.style.backgroundColor = "#0056b3";
    }

    function copyEmailToClipboard() {
      if (!rawTextContent) {
        generateEmail(); // Automatically generates if clicked before pressing Generate
      }
      
      navigator.clipboard.writeText(rawTextContent).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = "✓ Copied!";
        copyBtn.style.backgroundColor = "#28a745";
        
        setTimeout(() => {
          copyBtn.innerText = "📋 Copy Email Text";
          copyBtn.style.backgroundColor = "#0056b3";
        }, 3000);
      }).catch(err => {
        alert("Failed to copy automatically. Please select the text on screen and copy manually.");
      });
    }
  </script>
</body>
</html>
