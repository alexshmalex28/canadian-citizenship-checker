<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canadian Citizenship by Descent Document Generator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    .card { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    button { background: #d92525; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #b01c1c; }
    .doc-item { background: white; padding: 12px; border-left: 4px solid #d92525; margin-bottom: 10px; border-radius: 4px; }
    a { color: #0066cc; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>🇨🇦 Canadian Citizenship Document Generator</h1>
  <p>Fill out the generational link back to your Canadian ancestor to generate your IRCC checklist and form links.</p>

  <div class="card">
    <label><strong>How many generations back is your Canadian ancestor?</strong></label><br><br>
    <select id="generations">
      <option value="1">Parent (1st Generation)</option>
      <option value="2">Grandparent (2nd Generation)</option>
      <option value="3">Great-Grandparent (3rd Generation)</option>
    </select>
    <br><br>

    <label><input type="checkbox" id="nameChange"> Has anyone in the direct lineage had a legal name change?</label>
    <br><br>

    <button onclick="generateChecklist()">Generate Checklist & Links</button>
  </div>

  <div id="results" style="display:none;">
    <h2>📋 Your Generated Application Checklist</h2>
    <div id="checklistOutput"></div>
  </div>

  <script>
    function generateChecklist() {
      const gens = parseInt(document.getElementById('generations').value);
      const nameChange = document.getElementById('nameChange').checked;
      
      let html = '<h3>1. Official IRCC Forms & Fees</h3>';
      html += `<div class="doc-item">
        <strong>Main Application Form:</strong> CIT 0001 (Application for a Citizenship Certificate)<br>
        <a href="https://www.canada.ca/en/immigration-refugees-citizenship/services/application/application-forms-guides/cit0001.html" target="_blank">📄 Download Official Form CIT 0001</a>
      </div>`;
      
      html += `<div class="doc-item">
        <strong>Government Filing Fee:</strong> $75 CAD per applicant<br>
        <a href="https://www.cic.gc.ca/english/information/fees/index.asp" target="_blank">💳 Pay Fee via IRCC Portal</a>
      </div>`;

      html += '<h3>2. Required Documents to Obtain</h3>';
      
      // Applicant docs
      html += `<div class="doc-item">
        <strong>Applicant:</strong> Long-Form US Birth Certificate (listing parents' names)<br>
        <a href="https://www.vitalchek.com" target="_blank">🔗 Order via VitalChek</a>
      </div>`;
      
      if (nameChange) {
        html += `<div class="doc-item">
          <strong>Applicant / Lineage:</strong> Official Proof of Legal Name Change (Marriage Certificate or Court Order)<br>
          <a href="https://www.vitalchek.com" target="_blank">🔗 Order Vital Records</a>
        </div>`;
      }

      // Ancestor docs per generation
      for (let i = 1; i <= gens; i++) {
        const label = i === gens ? "Canadian Ancestor Anchor" : `Intermediate Generation ${i}`;
        if (i === gens) {
          html += `<div class="doc-item">
            <strong>${label}:</strong> Provincial/Territorial Official Long-Form Birth Certificate or Naturalization Record<br>
            <a href="https://www.canada.ca/en/immigration-refugees-citizenship/services/canadian-citizenship/proof-citizenship/documents.html" target="_blank">🇨🇦 IRCC Canadian Proof Guidelines</a>
          </div>`;
        } else {
          html += `<div class="doc-item">
            <strong>${label}:</strong> Long-Form US Birth Certificate (proving legal line of descent)<br>
            <a href="https://www.vitalchek.com" target="_blank">🔗 Order via VitalChek</a>
          </div>`;
        }
      }

      document.getElementById('checklistOutput').innerHTML = html;
      document.getElementById('results').style.display = 'block';
    }
  </script>
</body>
</html>
