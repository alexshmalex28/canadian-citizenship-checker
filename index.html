<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Citizenship Document Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #222222;
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      background-color: #f4f6f8;
    }
    .form-card {
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .btn-primary {
      background-color: #d92525;
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-primary:hover {
      background-color: #b01c1c;
    }
    .btn-copy {
      background-color: #0056b3;
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-copy:hover {
      background-color: #003d80;
    }
    .email-container {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 30px;
      font-family: Arial, sans-serif;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .email-header {
      background: #eef2f5;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
      border: 1px solid #d0d7de;
    }
  </style>
</head>
<body>

  <h2>🇨🇦 Canadian Citizenship Client Email Generator</h2>
  <p>Fill in the client's details to generate an updated email containing exact IRCC photo specifications, official link URLs, and direct document search repositories.</p>

  <div class="form-card">
    <div class="form-group">
      <label for="clientName">Client's Full Name:</label>
      <input type="text" id="clientName" placeholder="e.g., John Smith">
    </div>

    <div class="form-group">
      <label for="generations">How many generations back is the Canadian ancestor?</label>
      <select id="generations">
        <option value="1">Parent (1st Generation)</option>
        <option value="2">Grandparent (2nd Generation)</option>
        <option value="3">Great-Grandparent (3rd Generation)</option>
      </select>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" id="nameChange"> Client or ancestor had a legal name change (e.g., marriage)
      </label>
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="generateEmail()">Generate Client Email</button>
      <button class="btn-copy" id="copyBtn" onclick="copyEmailToClipboard()">📋 Copy Email Text</button>
    </div>
  </div>

  <div id="resultsArea" style="display:none;">
    <h3>Generated Email Output:</h3>
    <div class="email-container" id="emailBody"></div>
  </div>

  <script>
    let rawTextContent = "";

    function generateEmail() {
      const name = document.getElementById('clientName').value.trim() || 'Client';
      const gens = parseInt(document.getElementById('generations').value);
      const nameChange = document.getElementById('nameChange').checked;

      // HTML view header
      let htmlHeader = `<div class="email-header"><strong>Subject:</strong> Checklist & Updated IRCC Guidelines for Your Canadian Citizenship Application</div>`;
      
      // Plain text for clipboard
      rawTextContent = `Subject: Checklist & Updated IRCC Guidelines for Your Canadian Citizenship Application\n\n`;
      
      let bodyText = `Dear ${name},\n\n`;
      bodyText += `Thank you for reaching out regarding your application for a Canadian Citizenship Certificate (Proof of Citizenship).\n\n`;
      bodyText += `Based on your lineage (${gens} generation(s) back to your Canadian ancestor), below is the complete breakdown of official IRCC application forms, updated photo requirements, and specific sources for obtaining all required documents.\n\n`;

      bodyText += `--------------------------------------------------\n`;
      bodyText += `1. OFFICIAL IRCC FORMS & SUBMISSION PORTAL\n`;
      bodyText += `--------------------------------------------------\n\n`;
      
      bodyText += `• Application Form:\n`;
      bodyText += `  Form CIT 0001 (Application for a Citizenship Certificate)\n`;
      bodyText += `  Download URL: https://www.canada.ca/en/immigration-refugees-citizenship/services/application/application-forms-guides/cit0001.html\n\n`;

      bodyText += `• IRCC Official Online Application & Fee Payment Portal:\n`;
      bodyText += `  Portal URL: https://www.canada.ca/en/immigration-refugees-citizenship/services/canadian-citizenship/proof-citizenship/apply.html\n\n`;

      bodyText += `--------------------------------------------------\n`;
      bodyText += `2. UPDATED IRCC PHOTO SPECIFICATIONS\n`;
      bodyText += `--------------------------------------------------\n\n`;
      bodyText += `Important Note: US passport photos do NOT meet Canadian specifications. Please provide these guidelines to your professional studio photographer:\n\n`;
      
      bodyText += `• FOR ONLINE SUBMISSIONS:\n`;
      bodyText += `  - File Format: .JPEG or .JPG format\n`;
      bodyText += `  - Image Aspect Ratio: 3:2 in portrait orientation\n`;
      bodyText += `  - Resolution: Minimum 1200 x 1800 pixels (Max: 3000 x 4500 pixels)\n`;
      bodyText += `  - File Size: Between 200 KB and 5 MB\n`;
      bodyText += `  - Photo Guide URL: https://www.canada.ca/en/immigration-refugees-citizenship/services/canadian-passports/photos.html\n\n`;

      bodyText += `• FOR PAPER SUBMISSIONS:\n`;
      bodyText += `  - Physical Dimensions: 50 mm wide by 70 mm high (2" x 2-3/4")\n`;
      bodyText += `  - Back of Photo Details: Must show photographer name, complete studio address, and date taken\n\n`;

      bodyText += `--------------------------------------------------\n`;
      bodyText += `3. REQUIRED SUPPORTING DOCUMENTS & SOURCES TO OBTAIN\n`;
      bodyText += `--------------------------------------------------\n\n`;

      // Applicant Docs
      bodyText += `• APPLICANT IDENTIFICATION:\n`;
      bodyText += `  - Long-Form US Birth Certificate (Must list parents' full names)\n`;
      bodyText += `    Where to Request: State Department of Health / Vital Statistics or online via VitalChek\n`;
      bodyText += `    Source URL: https://www.vitalchek.com\n\n`;

      bodyText += `  - Two (2) Primary Identity Documents (e.g., Unexpired US Passport & Driver's License)\n`;
      bodyText += `    Where to Request: US Department of State / Local State DMV\n`;
      bodyText += `    Source URL: https://travel.state.gov\n\n`;

      if (nameChange) {
        bodyText += `• PROOF OF LEGAL NAME CHANGE:\n`;
        bodyText += `  - Official Marriage Certificate, Divorce Decree, or Legal Court Order\n`;
        bodyText += `    Where to Request: County Clerk / State Vital Records Office\n`;
        bodyText += `    Source URL: https://www.vitalchek.com\n\n`;
      }

      // Ancestor Docs
      for (let i = 1; i <= gens; i++) {
        if (i === gens) {
          bodyText += `• CANADIAN ANCESTOR (Generation ${i}):\n`;
          bodyText += `  - Official Provincial/Territorial Birth Certificate OR Canadian Citizenship Certificate\n`;
          bodyText += `    Where to Request (Provincial Births): Vital Statistics Agency of the specific Canadian Province of birth\n`;
          bodyText += `    Provincial Directory URL: https://www.canada.ca/en/immigration-refugees-citizenship/services/canadian-citizenship/proof-citizenship/documents.html\n\n`;
          bodyText += `    Where to Request (Historical Canadian Record Search): IRCC Official Search of Citizenship Records Application\n`;
          bodyText += `    Search Portal URL: https://www.canada.ca/en/immigration-refugees-citizenship/services/canadian-citizenship/proof-citizenship/search-records/how-to-apply.html\n\n`;
        } else {
          bodyText += `• INTERMEDIATE RELATIVE (Generation ${i}):\n`;
          bodyText += `  - Certified Long-Form US Birth Certificate (establishing line of descent)\n`;
          bodyText += `    Where to Request: State Department of Vital Statistics or online via VitalChek\n`;
          bodyText += `    Source URL: https://www.vitalchek.com\n\n`;
          
          bodyText += `  - Optional Ancestor Naturalization Searches (if applicable):\n`;
          bodyText += `    Where to Request: USCIS Genealogy Program or US National Archives (NARA)\n`;
          bodyText += `    Source URL: https://www.uscis.gov/genealogy\n\n`;
        }
      }

      bodyText += `--------------------------------------------------\n`;
      bodyText += `NEXT STEPS\n`;
      bodyText += `--------------------------------------------------\n`;
      bodyText += `Please begin gathering the vital records listed above. Once collected, reply to this email so we can review the documents before submitting your package to IRCC.\n\n`;
      bodyText += `Best regards,\n`;
      bodyText += `Citizenship Advisory Team`;

      rawTextContent += bodyText;

      document.getElementById('emailBody').innerHTML = htmlHeader + bodyText;
      document.getElementById('resultsArea').style.display = 'block';

      // Reset copy button styling
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "📋 Copy Email Text";
      copyBtn.style.backgroundColor = "#0056b3";
    }

    function copyEmailToClipboard() {
      if (!rawTextContent) {
        generateEmail();
      }
      
      navigator.clipboard.writeText(rawTextContent).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = "✓ Copied!";
        copyBtn.style.backgroundColor = "#28a745";
        
        setTimeout(() => {
          copyBtn.innerText = "📋 Copy Email Text";
          copyBtn.style.backgroundColor = "#0056b3";
        }, 3000);
      }).catch(err => {
        alert("Failed to copy automatically. Please select the text on screen and copy manually.");
      });
    }
  </script>
</body>
</html>
